name: currency-exchange

services:
  postgres:
    image: postgres:16-alpine
    container_name: currency_db
    environment:
      POSTGRES_DB: currency_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 90029002
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - currency-network

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: currency_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - currency-network
  # ===============================================

  migrator:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args:
        SERVICE_DIR: currency-service
        BUILD_TARGET: ./cmd/migrator/main.go
        BINARY_NAME: migrator
    image: currency-migrator:latest
    container_name: currency-migrator
    environment:
      DATABASE_URL: postgres://postgres:90029002@postgres:5432/currency_db?sslmode=disable
      DATABASE_DRIVER: "postgres"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - currency-network

  currency-api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args:
        SERVICE_DIR: currency-service
        BUILD_TARGET: ./cmd/api/main.go
        BINARY_NAME: currency-api
    image: currency-api:latest
    container_name: currency_api
    ports:
      - "8082:8082"   # HTTP REST API
      - "50051:50051" # ← gRPC API (добавлено)
    environment:
      # Server ports
      PORT: 8082
      GRPC_PORT: 50051 # ← Добавлено

      # API configuration
      EXCHANGE_API_KEY: 9c6542ec9e89a700eaaf6a4d
      BASE_CURRENCY: RUB
      CURRENCY_API_URL: "https://api.exchangerate-api.com/v4"
      ENVIRONMENT: production

      # Database
      DATABASE_URL: postgres://postgres:90029002@postgres:5432/currency_db?sslmode=disable
      DATABASE_DRIVER: postgres

      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      CACHE_TTL: "3600"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - currency-network
    healthcheck: # ← Добавлен healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  currency-worker:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args:
        SERVICE_DIR: currency-service
        BUILD_TARGET: ./cmd/worker/main.go
        BINARY_NAME: currency-worker
    image: currency-worker:latest
    container_name: currency_worker
    environment:
      CURRENCY_API_URL: "https://api.exchangerate-api.com/v4"
      EXCHANGE_API_KEY: 9c6542ec9e89a700eaaf6a4d
      BASE_CURRENCY: RUB
      DATABASE_URL: postgres://postgres:90029002@postgres:5432/currency_db?sslmode=disable
      DATABASE_DRIVER: postgres
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - currency-network

  auth-service:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args:
        SERVICE_DIR: auth-service
        BUILD_TARGET: ./main.go
        BINARY_NAME: auth-service
    image: auth-service:latest
    container_name: auth_service
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: my-production-secret-key-12345
    restart: unless-stopped
    networks:
      - currency-network

  gateway:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args:
        SERVICE_DIR: gateway
        BUILD_TARGET: ./cmd/gateway/main.go
        BINARY_NAME: gateway
    image: gateway:latest
    container_name: gateway
    ports:
      - "8380:8080"
    environment:
      PORT: 8080

      # Currency service endpoints
      CURRENCY_API_URL: http://currency-api:8082              # HTTP (для обратной совместимости)
      CURRENCY_GRPC_ADDRESS: currency-api:50051               # ← gRPC (добавлено)

      # Auth service
      AUTH_API_URL: http://auth-service:8081

      JWT_SECRET: my-production-secret-key-12345
      ENVIRONMENT: production
    depends_on:
      auth-service:
        condition: service_started
      currency-api:
        condition: service_healthy # ← Ждем здоровья currency-api
    restart: unless-stopped
    networks:
      - currency-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  currency-network:
    driver: bridge
